name: Recursive image

# Builds ./recursive (the 1.24.2 image with Cloudflare forwarding removed) and publishes it as tags of the same package:
# `recursive` (moves) and `recursive-<short sha>` (immutable — deploy this one, or its digest).
on:
  push:
    branches: [ "master" ]
    paths: [ "recursive/**", ".github/workflows/recursive-image.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ./recursive
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:recursive
            ${{ steps.names.outputs.image }}:recursive-${{ steps.names.outputs.short }}
